# GitHub Actions: runs the tests on every push and pull request to main,
# and by hand from the Actions tab (Run workflow), with a choice of suite.
name: UI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Suite file in the suites folder
        type: choice
        options: [testng, smoke, parallel, cucumber, all]
        default: all

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Chrome is already installed on GitHub's Ubuntu machines, and Selenium Manager
      # downloads the matching ChromeDriver, so there is nothing else to install.
      - name: Run the tests (headless Chrome)
        run: mvn -B clean test -DsuiteXmlFile=suites/${{ github.event.inputs.suite || 'all' }}.xml -Dheadless=true

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            reports/
            logs/
            target/surefire-reports/
          retention-days: 14
