# ---------------------------------------------------------------
#  Framework settings. Every key can be overridden from the
#  command line, for example:  mvn test -Dbrowser=firefox
# ---------------------------------------------------------------

# Browser: chrome | firefox | edge
browser=chrome
# true = run without opening a browser window (used on CI)
headless=false
# Browser window size when headless (and on start)
window.width=1366
window.height=768

# Application under test.
# The included demo shop starts automatically when base.url points to localhost.
base.url=http://localhost:8080
demo.app.autostart=true
demo.app.port=8080

# Waits (seconds)
explicit.wait=10
page.load.timeout=30

# Selenium Grid: set remote=true to run on a Grid (see docker-compose.yml)
remote=false
grid.url=http://localhost:4444

# Retry a failed TestNG test this many times (0 = no retry)
retry.count=1

# Attach a screenshot for passed steps too (failures always get one)
screenshot.on.pass=false

# Report
report.title=Automation Test Report
report.name=Selenium Java Framework

# Test data files (inside src/test/resources)
testdata.excel=testdata/LoginData.xlsx
testdata.csv=testdata/products.csv
testdata.json=testdata/customers.json
